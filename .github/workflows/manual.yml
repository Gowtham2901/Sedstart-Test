name: Sedstart Prod
 
on:
  workflow_dispatch:
jobs:
  sedstart-run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SedStart test run
        uses: sedinqa/sedstart@v1
        with:
          api_key: ${{ secrets.SEDSTART_API_KEY_PROD }}
          project_id: 561
          test_id: 4580
          profile_id: 1172
          browser: chrome
          headless: false

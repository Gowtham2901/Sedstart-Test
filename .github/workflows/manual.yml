name: Sedstart Local Mac

on:
  workflow_dispatch:

jobs:
  sedstart-run:
    runs-on: macos-15
    steps:
      - name: Install Playwright
        run: npm install -g playwright@1.52.0

      - name: Trigger SedStart test run
        uses: sedstart/runlocal@v1
        with:
          api_key: ${{ secrets.SEDSTART_API_KEY_PROD }}
          project_id: 1296
          suite_id: 1085
          profile_id: 2307
          browser: chrome
          headless: false

name: "Run CI on Sedstart No-Code Platform"
description: "Trigger CI run on Sedstart automation platform"
author: "Atmaram Naik / Sedstart"
branding:
  icon: "play"
  color: "blue"

inputs:
  api_key: 1dd2e650-6083-4725-9674-c20e0e1a2be7
    description: "APIKey for authentication"
    required: true
  project_id: 535
    description: "Project ID"
    required: true
  test_id: 4649
    description: "Test ID"
    required: true
  profile_id: 883
    description: "Profile ID"
    required: true
  browser: chrome
    description: "Browser to run the test (e.g., chrome)"
    required: true
  headless: false
    description: "Run in headless mode (true/false)"
    required: false
    default: "false"
  environment: prod
    description: "Environment to run on: QA or Prod (default: Prod)"
    required: false
    default: "Prod"

runs:
  using: 'node20'
  main: 'dist/index.js'
